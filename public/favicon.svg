<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="48" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f8f62"/>
      <stop offset="100%" stop-color="#31b87d"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>

  <!-- Subtle top highlight -->
  <rect x="0" y="0" width="48" height="12" rx="11" fill="white" fill-opacity="0.07"/>

  <!-- noofpi "n" + "pi" mark, raised to make room for the UI element below -->
  <path
    d="M13 14 H35 M18 14 V27 M30 14 V23 a4 4 0 0 0 4 4 h1"
    stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="13" cy="14" r="4.5" fill="white"/>

  <!-- UI element: a button/progress pill -->
  <rect x="11" y="33" width="26" height="7" rx="3.5" fill="white" fill-opacity="0.9"/>
  <circle cx="16.5" cy="36.5" r="1.5" fill="#1f8f62"/>
  <rect x="21" y="35.5" width="11" height="2" rx="1" fill="#1f8f62" fill-opacity="0.55"/>
</svg>
